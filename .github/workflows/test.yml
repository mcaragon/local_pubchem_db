name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up Java (CDK structure depictions)
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - name: Download CDK jars
      run: mvn -q -B -f java/pom.xml dependency:copy-dependencies -DoutputDirectory=lib
    - name: Install
      run: |
        python -m pip install --upgrade pip
        pip install ".[server]" httpx
    - name: Library tests
      run: python -m unittest pubchem2sqlite/tests/unittests_utils.py
    - name: Server tests
      env:
        REQUIRE_CDK: "1"  # fail instead of skipping the CDK depiction tests
      run: python -m unittest discover -s pubchem_local/tests -t . -v
